name: Build aarch64

# Builds Ship of Harkinian with Zelda's Errands compiled in, for the
# Anbernic RG40XX H (Allwinner H700, aarch64). Uses a native ARM runner, so
# there is no cross-toolchain to maintain - this mirrors how Shipwright's own
# generate-builds.yml produces its aarch64 artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Check out Shipwright (pinned)
        run: |
          git clone https://github.com/HarbourMasters/Shipwright.git shipwright
          cd shipwright
          git checkout d4bf6528a3bb242bc5d862e4f1ab2b6d385c157b
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat shipwright/linux-build-deps/apt.txt) ccache

      - name: Graft the mod into the tree
        run: |
          mkdir -p shipwright/soh/soh/Enhancements/ZeldasErrands
          cp mod/src/*.cpp mod/src/*.h shipwright/soh/soh/Enhancements/ZeldasErrands/
          ls -l shipwright/soh/soh/Enhancements/ZeldasErrands/

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: aarch64-ccache-${{ github.sha }}
          restore-keys: aarch64-ccache-

      - name: Configure
        run: |
          cd shipwright
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cd shipwright && cmake --build build-cmake --target soh -j$(nproc)

      - name: Generate the port asset archive
        run: cd shipwright && cmake --build build-cmake --target GenerateSohOtr

      - name: Confirm the mod is actually in the binary
        run: |
          cd shipwright
          for f in ZeldasErrands ZEParty ZEGuest ZEDecor ZETest; do
            test -f build-cmake/soh/CMakeFiles/soh.dir/soh/Enhancements/ZeldasErrands/$f.cpp.o \
              || { echo "mod object $f missing - it was not compiled in"; exit 1; }
          done
          echo "mod objects present"
          file build-cmake/soh/soh.elf

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: soh-aarch64-zeldas-errands
          path: |
            shipwright/build-cmake/soh/soh.elf
            shipwright/build-cmake/soh/soh.o2r

      # Also publish as a release: Actions artifacts are served from Azure
      # blob storage, which the development environment cannot reach, whereas
      # release assets come from githubusercontent and can be fetched directly.
      - name: Package
        run: |
          cd shipwright/build-cmake/soh
          tar czf "$GITHUB_WORKSPACE/soh-aarch64.tar.gz" soh.elf soh.o2r
          cd "$GITHUB_WORKSPACE"
          sha256sum soh-aarch64.tar.gz | tee soh-aarch64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            soh-aarch64.tar.gz soh-aarch64.sha256 \
            --title "aarch64 build ${GITHUB_RUN_NUMBER}" \
            --notes "Ship of Harkinian for aarch64 with Zelda's Errands compiled in. Commit ${GITHUB_SHA}." \
            --repo "$GITHUB_REPOSITORY"
